name: release

# Builds signed, shippable artifacts for a tag and attaches them to a draft release.
#
# Push a tag to cut a release:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# The release is created as a **draft**: nothing is published until a person has actually
# downloaded the installer and run it once. An automatic release is an automatic promise.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: build installer
        shell: pwsh
        run: ./installer/windows/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: installer/out/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # The keystore is a repository secret holding the base64 of the .jks. Written to a
      # path outside the checkout so no later step can accidentally archive it, and via
      # a heredoc rather than `echo` so the password never appears in a command line —
      # `ps` is readable by other processes on the runner.
      #
      # Required secrets:
      #   ANDROID_KEYSTORE_BASE64   base64 -w0 world-keeper-release.jks
      #   ANDROID_KEYSTORE_PASSWORD
      #   ANDROID_KEY_PASSWORD
      #   ANDROID_KEY_ALIAS
      - name: set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — see android/key.properties.example"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/release.jks
          EOF

      # `-PrequireReleaseSigning` makes the build *fail* rather than silently fall back to
      # the debug key. A debug-signed APK installs and runs and looks entirely normal —
      # and can never be updated, because Android refuses a properly-signed build over it.
      # Publishing one would strand every user who installed it.
      - name: build apk
        run: flutter build apk --release -PrequireReleaseSigning

      - name: build app bundle
        run: flutter build appbundle --release -PrequireReleaseSigning

      - name: remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: World Keeper ${{ github.ref_name }}
          files: artifacts/**/*
          body: |
            **Windows** — run the `.exe` installer. It is not code-signed, so Windows
            shows "Windows protected your PC" on first run; click More info → Run anyway.
            Installs per-user by default, so it does not ask for administrator.

            **Android** — the `.apk` installs directly; the `.aab` is for Play.

            World Keeper stops and restarts a live game server and overwrites world files.
            It backs up before every destructive step and rolls back on failure, but it is
            a homelab tool and comes with no guarantee against data loss. Keep your own
            backups.
