org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template.
#
# Left at false, and AGP pinned to 8.x in settings.gradle.kts, because the plugin
# ecosystem is currently split down the middle on AGP 9's built-in Kotlin:
#
#   needs builtInKotlin=true   file_picker 11.0.2, package:jni 1.0.1
#                              -> `if (agpMajor < 9) { apply kotlin-android }`, i.e. they
#                                 assume AGP 9 compiles their .kt sources for them.
#                                 With false, their Kotlin is silently never compiled:
#                                 "cannot find symbol: class FilePickerPlugin".
#
#   needs builtInKotlin=false  flutter_plugin_android_lifecycle 2.0.35
#                              -> applies kotlin-android unconditionally, which AGP 9
#                                 rejects outright when built-in Kotlin is on.
#
# There is no value of this flag that satisfies both on AGP 9. AGP 8.x is the only
# consistent point: every plugin applies kotlin-android itself and it just works.
# Revisit once the ecosystem finishes migrating.
android.builtInKotlin=false
